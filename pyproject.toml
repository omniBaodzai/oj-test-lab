[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oj-test-lab"
version = "1.0.0"
description = "Standalone test case generator and quality checker for online judges"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "openai>=1.50", "python-dotenv>=1.0", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["oj_test_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
